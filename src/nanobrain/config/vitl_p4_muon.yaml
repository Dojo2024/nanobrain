# ViT-L, 4 mm patches, 8 mm cube masking (~85%), Muon, decoder qk norm. The fomo_l_b92k_e20
# recipe on 8 GPUs (batch_size is per gpu: 4 x 8 = 32 images per step), on every FOMO300K image
# that passes qc (253,418, select_images --qc-only). Multi gpu, no 1 hour limit, so not a
# leaderboard run.
#   sbatch scripts/train_ddp.sbatch NAME --config src/nanobrain/config/vitl_p4_muon.yaml

train_filelist: src/nanobrain/config/fomo300k_images_qc.txt
patch_size: 4
num_visible: 4096
num_predict: 4096

model_kwargs:
  depth: 24
  embed_dim: 1024
  num_heads: 16
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 0
  decoder_qk_norm: true
  qk_scale_init: 4.0
  mask_cube: 2

batch_size: 4
base_lr: 1e-3
time_limit: null
# fomo_l_b92k_e20's budget (20 epochs of 86,713 images; 6.8 epochs of this list), warmup a
# quarter, linear decay over the last 20%
total_steps: 54195
warmup_steps: 13549
decay_steps: 10839

optimizer: muon
muon_lr_mult: 2.0
muon_fused: true
flash_attention_impl: FA3

checkpoint_period: 2710
plot_period: 0
