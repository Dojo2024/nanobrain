# Name of the run. Used for output directory suffix and wandb.
name: nanobrain

# Description of the run. Goes in wandb notes.
notes: null

# Root output directory. The run writes to <output_dir>/<name> when name is set.
output_dir: output

# Data.
data_root: data/FOMO300K_images
train_filelist: data/FOMO300K_images/filelist_subsampled.txt
num_workers: 8
# Sample scan types (the file name's last _ token, e.g. T1w) with probability proportional to
# image count ** modality_power, uniform within a type. null samples images uniformly; 0.5 is
# square-root sampling, which moves T1w from 66% to 42% of samples on filelist_subsampled.txt.
modality_power: null
prefetch_factor: 2

# Fixed 1mm grid that all images are fit to.
# todo: decide whether the grid should be a config option or constant
grid_size: [192, 240, 192]
patch_size: 8

# Sequence sampling. ~6400 mask patches per image on average, so num_visible 1280 is a
# ~0.8 mask ratio.
num_visible: 1280
num_predict: 1280
num_samples: 2
# Structured masking, or null for random patches. A list of group shapes [gx, gy, gz] in
# patches; each sequence picks one shape and shuffles whole groups, so a group's patches are
# seen or hidden together. Axes are RAS: 0 left-right, 1 back-front, 2 bottom-top.
# [[1, 1, 30]] = full tubes along bottom-top (axial), [[4, 4, 4]] = 32 mm blocks.
mask_groups: null
# Standardize each target patch by its in-mask mean and variance (MAE's norm_pix_loss), so the
# loss is on local structure rather than intensity level.
norm_target: false
# Weight of the stats_head loss (model_kwargs.stats_head, needs norm_target): each predicted patch's
# in-mask intensity mean and log std, the information norm_target takes out of the target.
stats_weight: 1.0

# Model (ViT-S encoder).
model_kwargs:
  depth: 12
  embed_dim: 384
  num_heads: 6
  decoder_depth: 4
  decoder_embed_dim: 512
  decoder_num_heads: 8
  class_tokens: 1
  drop_path_rate: 0.0
  # 2 extra decoder outputs per patch for its intensity mean and log std (see stats_weight)
  stats_head: false
  # self: MAE decoder over visible + mask tokens. cross: mask tokens cross-attend to the visible
  # embeddings only (CrossMAE), ~0.4x the decoder flops at 1280 visible / 1280 predicted.
  decoder_type: self
  # Hyper-connections in the encoder (Zhu et al., ICLR 2025, arXiv 2409.19606): the number of
  # residual streams per token (the expansion rate n), or 0 for the plain residual. hc_dynamic:
  # input-dependent mixing (DHC) on top of the learned static mixing (SHC).
  hyper_connections: 0
  hc_dynamic: true

# Optimization. batch_size is images per step; each gives num_samples sequences.
epochs: 40
batch_size: 32
accum_iter: 1

base_lr: 0.001
lr: null
min_lr: 1e-6
warmup_epochs: 5
# Decay after warmup: cosine or linear.
lr_decay: cosine
# Seconds of training, or null. If set, the lr schedule is keyed to elapsed wall time instead of
# steps: the budget spans the epochs * steps_per_epoch schedule, so the lr finishes decaying when
# the budget runs out, and training stops there. epochs is then the expected number of epochs.
time_budget: null
weight_decay: 0.05
# adamw, or muon: Muon for the hidden weight matrices (misc.MUON_PREFIXES) and AdamW for the
# rest, with Muon's update matched to AdamW's rms so both use lr and weight_decay as is.
optimizer: adamw
# Scales the lr of the Muon params only (optimizer muon); AdamW params keep lr.
muon_lr_mult: 1.0
# torch: torch.optim.Muon, one matrix at a time. batched: misc.BatchedMuon, the same update with
# same-shape matrices orthogonalized together, so fewer kernel launches per step.
muon_impl: torch
betas: [0.9, 0.95]
clip_grad: 1.0
fused_adamw: true

amp: true
amp_dtype: bfloat16
compile: true

# EMA copies of the weights for evaluation, a list of decays, or null. Each is updated after every
# optimizer step and saved each epoch as checkpoint-ema<decay>.pth, a model-only checkpoint the
# eval loads as is. Not resumable.
ema_decays: null

# Checkpointing.
ckpt: null
resume: false
auto_resume: true
start_epoch: 0
checkpoint_period: 10
max_checkpoints: 5

# Logging.
print_freq: 100
plot_period: 5
plot_nrow: 4
plot_ncol: 2
# Number of patches to predict for plotting. null predicts all unseen mask patches.
plot_num_predict: null

device: cuda
seed: 7338
debug: false

wandb: false
wandb_entity: null
wandb_project: nanobrain
